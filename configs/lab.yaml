# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G01                                # e.g. G01
owner: "Member 1 (Lead / Integrator)"        # mandatory for every Decision
track_config: tracks/t03.yaml                # Track T03: Synthetic-vs-Real
track: t03                                   # must match track_config
input: fixtures/t03_synthetic                # de bai chinh thuc (thay cham). Anh cua nhom: chay them --input data/t03_real
output: out/
seed: 42
offline: true                                # demo/eval must not touch the network
strict_provenance: true                      # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  max_unusable_rate: 0.30                    # Member 5: REWORK neu ti le unusable vuot nguong nay
  budget: 10                                 # review budget B (khai trong metric_contract.md)
  # Nguong QC (Member 4 + 6): dien va COMMIT truoc khi chay holdout, khong sua sau do
  thresholds:
    night_sev2_mean_ratio: 0.14
    night_sev1_mean_ratio: 0.40
    blur_sev2_lap_ratio: 0.0032
    blur_sev2_std_ratio: 0.895
    blur_sev1_lap_ratio: 0.06
    fog_sev2_std_ratio: 0.60
    fog_sev2_lap_ratio: 0.25
    fog_sev1_std_ratio: 0.82
    glare_sev2_strength: 0.75
    glare_sev1_strength: 0.40
    erase_max_std: 3.5
    erase_max_color_std: 6.0
    erase_min_parent_std: 12.0
    erase_min_mad: 10.0
